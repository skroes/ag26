function hav(a,b){const R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=p2-p1,dl=(b.lng-a.lng)*Math.PI/180;const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function loopInfo(p){const d=Math.round(hav(THUIS,p)*1.3/50)*50;const dh=p.elev-THUIS.elev;let zw="vlak";if(dh>60)zw="stevig ↑";else if(dh>25)zw="licht ↑";else if(dh<-60)zw="stevig ↓ (terug = klim!)";else if(dh<-25)zw="licht ↓";return {d,dh,zw};}
function openStatus(p,t){ // t = minuten sinds middernacht vandaag; retour: 'open'|'dicht'|'onbekend' + tekst
  if(!p.slots) return {s:"onbekend",txt:"tijden onbekend"};
  const day=(new Date()).getDay(); const sl=p.slots[day]||[];
  for(const [a,b] of sl){ if(t>=a&&t<b){ const rest=b-t; return {s:"open",txt:rest<60?("sluit over "+rest+" min ⚠️"):("open tot "+fm(b))}; } }
  const next=sl.find(([a])=>a>t); return {s:"dicht",txt:next?("dicht — open om "+fm(next[0])):"vandaag dicht"};
}
function fm(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}

function tapPoi(p){
  const cp=map.latLngToContainerPoint([p.lat,p.lng]);

  if(buurt.length>1){ sheetKeuze(buurt); } else { sheet(p); }
}

  map.setView(SCALA_CENTER, SCALA_ZOOM);
}
function sheetScala(r){
  huidigPoi=null; document.getElementById('favbtn2').classList.remove('on');
  const e=r.pts[r.pts.length-1];
  document.getElementById('sheetbody').innerHTML=`
    <div class="cat">🤍 Scala dei Turchi · looproute ${r.l}</div><h2>${r.naam}</h2>
    <div class="row"><span class="tag ok">📏 ${r.stat}</span></div>
    <div class="letop" style="font-size:15px;line-height:1.5">${r.info}</div>
    <a class="go" href="https://www.google.com/maps/dir/?api=1&destination=${e[0]},${e[1]}&travelmode=walking" target="_blank">📍 Loop naar het eindpunt</a>`;
  document.getElementById('sheet').classList.add('open');
}
function naarScala(){ map.setView(SCALA_CENTER, SCALA_ZOOM); sluitMenu(); }
function naarAgrigento(){ map.setView([THUIS.lat,THUIS.lng], 14); sluitMenu(); }
let fDagdeel="nu", fCats=new Set(), markers=[];
const DAGDELEN=[["alles","🗺","Alles","geen tijdfilter"],["nu","🟢","Nu","open én verstandig op dit moment"],["ochtend","🌅","Ochtend","vroeg, vóór de hitte"],["middag","☀️","Middag","11–18 u: binnen/gekoeld"],["avond","🌙","Avond","na 18 u, ook de tempels"]];
const CATINFO={parkeren:"waar je de auto kwijt kan (Scala)",fotopunt:"beste foto-plekken",uitzicht:"mooiste uitzichten & terrassen",bezienswaardigheid:"tempels, kerken, musea",eten:"restaurants — reserveer!",zoet:"ijs & cannoli",strand:"zee & lungomare",uitstapje:"met de auto eropuit",praktisch:"super, taxi, station"};
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes();}
function past(p){
  if(fFav && !favs.has(p.id)) return false;
  if(fCats.size && !fCats.has(p.cat)) return false;
  if(fDagdeel==="alles") return true;
  if(fDagdeel==="nu"){ const t=nowMin(); const st=openStatus(p,t); if(st.s==="dicht") return false;
    if(t>=660&&t<1080) return p.dagdeel.includes("middag");
    return true; }
  return p.dagdeel.includes(fDagdeel);
}
function render(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  POIS.forEach(p=>{ const on=past(p);
    const m=L.marker([p.lat,p.lng],{opacity:on?1:0.25,icon:L.divIcon({className:'',html:'<div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><span class="lm">'+CATS[p.cat].e+'</span></div>',iconSize:[44,44],iconAnchor:[22,22]})}).addTo(map);
    m.on('click',()=>tapPoi(p)); markers.push(m); });
  badge();
}
function badge(){
  let n=fCats.size+(fFav?1:0)+(routeOn?1:0)+(wandelOn?1:0)+(tempelOn?1:0)+(scalaOn?1:0)+(fDagdeel!=="nu"&&fDagdeel!=="alles"?1:0);
  const b=document.getElementById('hambadge');
  b.style.display=n?"inline-flex":"none"; b.textContent=n;
}
// ===== hamburger-menu =====
function openMenu(){ bouwMenu(); document.getElementById('drawer').classList.add('open'); document.getElementById('scrim').classList.add('open'); }
function sluitMenu(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }
function mrow(aan,ico,titel,sub,fn){ return `<button class="mrow${aan?' aan':''}" onclick="${fn}"><span class="ico">${ico}</span><span class="tekst">${titel}<small>${sub}</small></span><span class="vink">✓</span></button>`; }
function bouwMenu(){
  let h='<div class="sectie">Gebied</div>';
  h+=mrow(false,"🏛","Agrigento","stad, tempels, thuisbasis","naarAgrigento()");
  h+=mrow(false,"🤍","Scala dei Turchi","Realmonte — parkeren, strand, fotopunten","naarScala()");
  h+='<div class="sectie">Wanneer</div>';
  DAGDELEN.forEach(([k,ico,t,sub])=>{ h+=mrow(fDagdeel===k,ico,t,sub,`kiesDD('${k}')`); });
  h+='<div class="sectie">Kaartlaag</div>';
  [['licht','◻️','Licht (faded)','markers vallen op — voor in de zon'],['donker','⬛','Donker','avond-modus'],['osm','🗺','Kleurrijk (OSM)','de klassieke OpenStreetMap-look'],['sat','🛰','Satelliet','luchtfoto (Esri)']].forEach(([k,ico,t,sub])=>{ h+=mrow(kaartlaag===k,ico,t,sub,`zetLaag('${k}')`); });
  h+='<div class="sectie">Wat</div>';
  h+=mrow(fFav,"⭐","Mijn favorieten","alleen je eigen selectie","togFavFilter()");
  h+=mrow(routeOn,"🛣","Aanrijroute","Catania → SS640 → Agrigento, met waypoints","toggleRoute()");
  h+=mrow(wandelOn,"🚶","Looproute zo-avond","huisje → Atenea → boulevard → huisje · 4,9 km, 5 segmenten","toggleWandel()");
  h+=mrow(tempelOn,"🏛","Tempelpad (op het terrein)","Giunone → Concordia → Ercole en terug · 3,2 km","toggleTempel()");
  h+=mrow(scalaOn,"🤍","Scala-looproutes A/B/C","kort-met-trap · trapvrij · vanaf Capo Rossello","toggleScala()");
  Object.entries(CATS).forEach(([k,v])=>{ h+=mrow(fCats.has(k),v.e,k.charAt(0).toUpperCase()+k.slice(1),CATINFO[k],`kiesCat('${k}')`); });
  document.getElementById('dbody').innerHTML=h;
}
var kiesDD=function(k){ fDagdeel=k; bouwMenu(); render(); };
var kiesCat=function(k){ fCats.has(k)?fCats.delete(k):fCats.add(k); bouwMenu(); render(); };
var togFavFilter=function(){ fFav=!fFav; bouwMenu(); render(); };
// ===== header collapse + banner =====
function togKop(){ const k=document.getElementById('kop'); k.classList.toggle('uit'); document.getElementById('chev').classList.toggle('open2'); }
function sluitSheet(){ document.getElementById('sheet').classList.remove('open'); }
document.getElementById('close').onclick=sluitSheet;
map.on('click', sluitSheet);
// filters onthouden over refresh heen
try{ const f=JSON.parse(localStorage.getItem('agr-filters')||"{}");
  if(f.dd) fDagdeel=f.dd; if(f.cats) fCats=new Set(f.cats); if(f.fav) fFav=true;
}catch(e){}
const bewaarFilters=()=>localStorage.setItem('agr-filters',JSON.stringify({dd:fDagdeel,cats:[...fCats],fav:fFav}));
const _kiesDD=kiesDD, _kiesCat=kiesCat, _togFavFilter=togFavFilter;
kiesDD=(k)=>{_kiesDD(k);bewaarFilters();};
kiesCat=(k)=>{_kiesCat(k);bewaarFilters();};
togFavFilter=()=>{_togFavFilter();bewaarFilters();};
setTimeout(()=>document.getElementById('banner').classList.add('weg'), 20000);
render();
setInterval(render, 60000);
</script>
</body>
