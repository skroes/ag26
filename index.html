// Eigen locatie (werkt betrouwbaar via HTTPS, bv. Vercel-deploy)
let locMarker=null, locCircle=null, locOn=false;
function toggleLocate(){
  const btn=document.getElementById('locbtn');
  if(locOn){ locOn=false; btn.classList.remove('on'); if(locMarker){map.removeLayer(locMarker);locMarker=null;} if(locCircle){map.removeLayer(locCircle);locCircle=null;} return; }
  if(!navigator.geolocation){ alert("Geen locatie-ondersteuning in deze browser."); return; }
  locOn=true; btn.classList.add('on');
  navigator.geolocation.watchPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude];
    if(!locMarker){ locMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<span class="lm" style="font-size:26px">🔵</span>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map).bindTooltip("Jij");
      locCircle=L.circle(ll,{radius:pos.coords.accuracy,color:'#1a56b0',weight:1,fillOpacity:.08}).addTo(map);
      map.setView(ll,15); }
    else { locMarker.setLatLng(ll); locCircle.setLatLng(ll); locCircle.setRadius(pos.coords.accuracy); }
  },err=>{ locOn=false; btn.classList.remove('on'); alert("Locatie geweigerd of niet beschikbaar ("+err.message+"). Tip: werkt het best via de Vercel-URL (https)."); },{enableHighAccuracy:true,maximumAge:5000});
}

function hav(a,b){const R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=p2-p1,dl=(b.lng-a.lng)*Math.PI/180;const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function loopInfo(p){const d=Math.round(hav(THUIS,p)*1.3/50)*50;const dh=p.elev-THUIS.elev;let zw="vlak";if(dh>60)zw="stevig ↑";else if(dh>25)zw="licht ↑";else if(dh<-60)zw="stevig ↓ (terug = klim!)";else if(dh<-25)zw="licht ↓";return {d,dh,zw};}
function openStatus(p,t){ // t = minuten sinds middernacht vandaag; retour: 'open'|'dicht'|'onbekend' + tekst
  if(!p.slots) return {s:"onbekend",txt:"tijden onbekend"};
  const day=(new Date()).getDay(); const sl=p.slots[day]||[];
  for(const [a,b] of sl){ if(t>=a&&t<b){ const rest=b-t; return {s:"open",txt:rest<60?("sluit over "+rest+" min ⚠️"):("open tot "+fm(b))}; } }
  const next=sl.find(([a])=>a>t); return {s:"dicht",txt:next?("dicht — open om "+fm(next[0])):"vandaag dicht"};
}
function fm(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}

 {naam:"Start — Catania (A19 richting Palermo)", lat:37.470, lng:15.045, ico:"🚗", uitleg:"Vanuit Catania de A19 op richting Palermo/Enna. Navigatie-bestemming voor dit eerste stuk: <b>Caltanissetta</b>."},

let routeOn=false, routeLayers=[];
function toggleRoute(){
  const btn=document.getElementById('routebtn');
  if(routeOn){ routeOn=false; btn.style.background="#fff"; routeLayers.forEach(l=>map.removeLayer(l)); routeLayers=[]; render(); return; }
  routeOn=true; btn.style.background="#c9b3f5";
  const line=L.polyline(ROUTE_PTS,{color:'#6a35c9',weight:4,opacity:.85}).addTo(map);
  routeLayers.push(line);
  WAYPOINTS.forEach(w=>{
    const m=L.marker([w.lat,w.lng],{icon:L.divIcon({className:'',html:'<span class="lm" style="font-size:26px">'+w.ico+'</span>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(map);
    m.on('click',()=>sheetWaypoint(w)); routeLayers.push(m);
  });
  map.fitBounds(line.getBounds(),{padding:[30,30]});
}
function sheetWaypoint(w){
  huidigPoi=null; document.getElementById('favbtn2').classList.remove('on');
  document.getElementById('sheetbody').innerHTML=`
    <div class="cat">🛣 aanrijroute</div><h2>${w.naam}</h2>
    <div class="letop">${w.uitleg}</div>
    <div class="letop" style="background:#f3edff;border-color:#6a35c9">Lijn volgt de werkelijke weg (OSRM/OpenStreetMap): A19 → afrit Caltanissetta → SS640. 164 km, ±2u15. Brandinfo: 19–23 jul (Monti Sicani/SS189); check actueel nieuws vóór vertrek.</div>
    <a class="go" href="https://www.google.com/maps/dir/?api=1&destination=${w.lat},${w.lng}&travelmode=driving" target="_blank">📍 Navigeer naar dit punt</a>`;
  document.getElementById('sheet').classList.add('open');
}

// Favorieten (⭐) — bewaard in localStorage, filter via ⭐-chip
let favs = new Set(JSON.parse(localStorage.getItem('agr-favs')||"[]"));
let fFav = false, huidigPoi = null;
function togFav(){ if(!huidigPoi) return; favs.has(huidigPoi.id)?favs.delete(huidigPoi.id):favs.add(huidigPoi.id);
  localStorage.setItem('agr-favs',JSON.stringify([...favs]));
  document.getElementById('favbtn2').classList.toggle('on',favs.has(huidigPoi.id)); render(); }
document.getElementById('favbtn2').onclick=togFav;

let fDagdeel="nu", fCat=null, markers=[];
const DAGDELEN=[["nu","🟢 NU"],["ochtend","🌅 Ochtend"],["middag","☀️ Middag (binnen)"],["avond","🌙 Avond"]];
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes();}
function past(p){
  if(fFav && !favs.has(p.id)) return false;
  if(fCat && p.cat!==fCat) return false;
  if(fDagdeel==="nu"){ const t=nowMin(); const st=openStatus(p,t); if(st.s==="dicht") return false;
    if(t>=660&&t<1080) return p.dagdeel.includes("middag"); // 11-18u: alleen middag-geschikt
    return true; }
  return p.dagdeel.includes(fDagdeel);
}
function render(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  POIS.forEach(p=>{ const on=past(p);
    const m=L.marker([p.lat,p.lng],{opacity:on?1:0.25,icon:L.divIcon({className:'',html:'<span class="lm">'+CATS[p.cat].e+'</span>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map);
    m.on('click',()=>sheet(p)); markers.push(m); });
}
function sheet(p){
  huidigPoi=p; document.getElementById('favbtn2').classList.toggle('on',favs.has(p.id));
  const li=loopInfo(p), st=openStatus(p,nowMin());
  const klim=p.modus==="lopen"?`<span class="tag">🚶 ±${li.d} m · ${li.dh>=0?"+":""}${li.dh} m (${li.zw})</span>`:`<span class="tag">${p.modus==="auto"?"🚗 auto":"🚌 bus"} · hoogte ${p.elev} m</span>`;
  document.getElementById('sheetbody').innerHTML=`
    <div class="cat">${CATS[p.cat].e} ${p.cat}</div><h2>${p.naam}</h2>
    <div class="row">
      <span class="tag ${st.s==="open"?"ok":(st.s==="dicht"?"warn":"")}">${st.s==="onbekend"?"🕐 tijden onbekend":(st.s==="open"?"🟢 ":"🔴 ")+st.txt}</span>
      ${klim}
      ${p.kosten?`<span class="tag">💶 ${p.kosten}</span>`:""}
      ${p.res?`<span class="tag warn">📞 reserveren!</span>`:""}
    </div>
    ${p.letop?`<div class="letop">${p.letop}</div>`:""}
    <a class="go" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}${p.modus==="lopen"?"&travelmode=walking":"&travelmode=driving"}" target="_blank">📍 Route in Google Maps</a>`;
  document.getElementById('sheet').classList.add('open');
}
document.getElementById('close').onclick=()=>document.getElementById('sheet').classList.remove('open');
map.on('click',()=>document.getElementById('sheet').classList.remove('open'));

const chipsEl=document.getElementById('chips');
DAGDELEN.forEach(([k,lbl])=>{const b=document.createElement('button');b.className="chip"+(k==="nu"?" now on":"");b.textContent=lbl;b.dataset.dd=k;
  b.onclick=()=>{fDagdeel=k;document.querySelectorAll('[data-dd]').forEach(x=>x.classList.toggle('on',x.dataset.dd===k));render();};chipsEl.appendChild(b);});
const fb=document.createElement('button');fb.className="chip";fb.textContent="⭐";
fb.onclick=()=>{fFav=!fFav;fb.classList.toggle('on',fFav);render();};chipsEl.appendChild(fb);
Object.entries(CATS).forEach(([k,v])=>{const b=document.createElement('button');b.className="chip";b.textContent=v.e;b.dataset.cat=k;b.style.borderColor=v.c;
  b.onclick=()=>{fCat=(fCat===k?null:k);document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('on',x.dataset.cat===fCat));render();};chipsEl.appendChild(b);});
render();
setInterval(render, 60000);
