function hav(a,b){const R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=p2-p1,dl=(b.lng-a.lng)*Math.PI/180;const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function loopInfo(p){const d=Math.round(hav(THUIS,p)*1.3/50)*50;const dh=p.elev-THUIS.elev;let zw="vlak";if(dh>60)zw="stevig ↑";else if(dh>25)zw="licht ↑";else if(dh<-60)zw="stevig ↓ (terug = klim!)";else if(dh<-25)zw="licht ↓";return {d,dh,zw};}
function openStatus(p,t){ // t = minuten sinds middernacht vandaag; retour: 'open'|'dicht'|'onbekend' + tekst
  if(!p.slots) return {s:"onbekend",txt:"tijden onbekend"};
  const day=(new Date()).getDay(); const sl=p.slots[day]||[];
  for(const [a,b] of sl){ if(t>=a&&t<b){ const rest=b-t; return {s:"open",txt:rest<60?("sluit over "+rest+" min ⚠️"):("open tot "+fm(b))}; } }
  const next=sl.find(([a])=>a>t); return {s:"dicht",txt:next?("dicht — open om "+fm(next[0])):"vandaag dicht"};
}
function fm(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}

  h+=mrow(fFav,"⭐","Mijn favorieten","alleen je eigen selectie","togFavFilter()");
  h+=mrow(routeOn,"🛣","Aanrijroute","Catania → SS640 → Agrigento, met waypoints","toggleRoute()");
  Object.entries(CATS).forEach(([k,v])=>{ h+=mrow(fCats.has(k),v.e,k.charAt(0).toUpperCase()+k.slice(1),CATINFO[k],`kiesCat('${k}')`); });
  document.getElementById('dbody').innerHTML=h;
}
var kiesDD=function(k){ fDagdeel=k; bouwMenu(); render(); };
var kiesCat=function(k){ fCats.has(k)?fCats.delete(k):fCats.add(k); bouwMenu(); render(); };
var togFavFilter=function(){ fFav=!fFav; bouwMenu(); render(); };
// ===== header collapse + banner =====
function togKop(){ const k=document.getElementById('kop'); k.classList.toggle('uit'); document.getElementById('chev').classList.toggle('open2'); }
function sluitSheet(){ document.getElementById('sheet').classList.remove('open'); }
document.getElementById('close').onclick=sluitSheet;
map.on('click', sluitSheet);
// filters onthouden over refresh heen
try{ const f=JSON.parse(localStorage.getItem('agr-filters')||"{}");
  if(f.dd) fDagdeel=f.dd; if(f.cats) fCats=new Set(f.cats); if(f.fav) fFav=true;
}catch(e){}
const bewaarFilters=()=>localStorage.setItem('agr-filters',JSON.stringify({dd:fDagdeel,cats:[...fCats],fav:fFav}));
const _kiesDD=kiesDD, _kiesCat=kiesCat, _togFavFilter=togFavFilter;
kiesDD=(k)=>{_kiesDD(k);bewaarFilters();};
kiesCat=(k)=>{_kiesCat(k);bewaarFilters();};
togFavFilter=()=>{_togFavFilter();bewaarFilters();};
setTimeout(()=>document.getElementById('banner').classList.add('weg'), 20000);
render();
setInterval(render, 60000);
</script>
